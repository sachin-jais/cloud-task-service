services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloud-task-service
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=docker-compose
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
